<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wishlist · ZAURA Store</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/enhancements.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container">
            <a class="navbar-brand logo" href="index.html"><img src="img/logo-transparent.png" alt="ZAURA" height="58"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="mens.html" role="button" data-bs-toggle="dropdown">MEN</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="mens.html">Shirts</a></li>
                            <li><a class="dropdown-item" href="mens.html">T-Shirts</a></li>
                            <li><a class="dropdown-item" href="mens.html">Jeans</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="womens.html" role="button" data-bs-toggle="dropdown">WOMEN</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="womens.html">Kurti</a></li>
                            <li><a class="dropdown-item" href="womens.html">T-Shirts</a></li>
                            <li><a class="dropdown-item" href="womens.html">Tops</a></li>
                            <li><a class="dropdown-item" href="womens.html">Pant</a></li>
                            <li><a class="dropdown-item" href="womens.html">Short Kurti</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">CONTACT US</a></li>
                </ul>
                <div class="header-right">
                    <a href="signin.html" class="signin">Sign In</a>
                    <a href="#" data-bs-toggle="modal" data-bs-target="#searchModal"><i class="bi bi-search"></i></a>
                    <a href="#" id="wishlist-icon"><i class="bi bi-heart-fill"></i></a>
                    <a href="cart.html" class="cart-icon" id="cart-icon"><i class="bi bi-bag"></i><span>00</span></a>
                </div>
            </div>
        </div>
    </nav>

    <section class="container my-5">
        <h2 class="mb-4">My Wishlist</h2>
        <div id="wishRoot"></div>
    </section>

    <div class="modal fade" id="searchModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Search Products</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body"><input type="text" class="form-control" placeholder="Search products..."></div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/site.js"></script>
    <script>
      (function () {
        const root = document.getElementById("wishRoot");
        function render() {
          const w = window.ZAURA.getWish();
          if (!w.length) { root.innerHTML = '<div class="text-center py-5 text-muted">Your wishlist is empty. <br><a href="index.html" class="pdp-btn primary d-inline-block mt-3">Continue Shopping</a></div>'; return; }
          root.innerHTML = '<div class="wish-grid">' + w.map(id => {
            const p = window.ZAURA_PRODUCTS[id]; if (!p) return "";
            return '<div class="product-card"><a href="product.html?id=' + id + '"><img src="' + p.image + '" style="width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px" loading="lazy" decoding="async"></a><div class="product-info p-2"><h5 class="product-title mt-2">' + p.name + '</h5><div class="price">Rs.' + p.price.toFixed(2) + '</div><button data-remove="' + id + '" class="pdp-btn ghost mt-2" style="width:100%">Remove</button></div></div>';
          }).join("") + '</div>';
          root.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => {
            const id = b.getAttribute("data-remove");
            window.ZAURA.setWish(window.ZAURA.getWish().filter(x => x !== id));
            window.ZAURA.updateWishBadge(); render();
          }));
        }
        document.addEventListener("DOMContentLoaded", render);
      })();
    </script>
    <script src="js/images.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
