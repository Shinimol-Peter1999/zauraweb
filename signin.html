<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — ZAURA</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/enhancements.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container">
      <a class="navbar-brand logo" href="index.html"><img src="img/logo-transparent.png" alt="ZAURA"></a>
      <a href="index.html" class="ms-auto text-muted small">← Back to store</a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome back</h1>
        <p>Sign in to continue shopping your favourites.</p>
      </div>

      <form id="signinForm" class="auth-form" novalidate>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
            <button type="button" class="pw-toggle" aria-label="Toggle password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="auth-row">
          <label class="check"><input type="checkbox"> Remember me</label>
          <a href="#" class="muted-link">Forgot password?</a>
        </div>
        <div class="auth-error" id="authError"></div>
        <button type="submit" class="auth-btn">Sign In</button>
        <p class="auth-alt">New to ZAURA? <a href="signup.html">Create an account</a></p>
      </form>
    </div>
  </main>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("signinForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(this).entries());
      const res = window.ZAURA_AUTH.signIn(data);
      const err = document.getElementById("authError");
      if (!res.ok) { err.textContent = res.error; return; }
      err.textContent = "";
      window.location.href = "index.html";
    });
    document.querySelector(".pw-toggle").addEventListener("click", function () {
      const inp = this.previousElementSibling;
      inp.type = inp.type === "password" ? "text" : "password";
      this.querySelector("i").className = inp.type === "password" ? "bi bi-eye" : "bi bi-eye-slash";
    });
  </script>
</body>
</html>
